# Owned by the co-creative platform (template dotnet-aca-v1). Changes arrive as pull requests from the
# platform (sync-app-repo.ps1); edit platform.images.json rather than this file.
#
# On push to main: test; deploy the app's own resources (infra/app.bicep); build every image in
# platform.images.json and push it tagged with the commit SHA; update the web app / jobs with the new images
# and the configuration in platform.app.json; record the delivery on rg-<slug>; smoke-test /health.
# The platform repository (apps/<slug>/main.bicepparam) defines which components exist, auth, DNS, mounts,
# AI and the ceilings.
# On pull requests: the test job only (nothing is built, pushed or deployed).
#
# Repository variables (set by the platform's new-app.ps1; no secrets): AZURE_CLIENT_ID, AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, ACR_LOGIN_SERVER, APP_SLUG, APP_RESOURCE_GROUP, APP_HOSTNAME.
name: Platform deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: read   # delivery flow check: was the delivered commit a merged pull request?
  packages: read   # private NuGet packages from the co-creative GitHub Packages feed (e.g. CoCreative.UI)

concurrency:
  # Deliveries run one at a time and are never cancelled; pull request runs are per PR and superseded by newer pushes.
  group: ${{ github.event_name == 'pull_request' && format('platform-pr-{0}', github.ref) || 'platform-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: SDK version (global.json sdk.version, else the latest .NET 11)
        id: sdk
        run: |
          v=$(python3 -c "import json; print(json.load(open('global.json')).get('sdk',{}).get('version',''))" 2>/dev/null || true)
          echo "version=${v:-11.0.x}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}
          dotnet-quality: ${{ endsWith(steps.sdk.outputs.version, '.x') && 'preview' || '' }}   # only for the 11.0.x fallback; an exact global.json SDK needs none
      - name: Test
        # Private packages: a nuget.config with the co-creative GitHub Packages feed reads %NUGET_AUTH_TOKEN%
        # (the workflow token, read-only; the package must grant this repository Actions access).
        env:
          NUGET_AUTH_TOKEN: ${{ github.token }}
        # A solution at the root (.sln or .slnx) is tested; without one, tests are skipped with a visible warning
        # (e.g. non-.NET apps). 'ls a b' fails when either pattern matches nothing, so compgen is used per pattern.
        run: |
          if compgen -G '*.sln' >/dev/null || compgen -G '*.slnx' >/dev/null; then
            dotnet test
          else
            echo "::warning::No .sln or .slnx at the repository root: tests skipped"
          fi

  deliver:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      ACR: ${{ vars.ACR_LOGIN_SERVER }}
      SLUG: ${{ vars.APP_SLUG }}
      RG: ${{ vars.APP_RESOURCE_GROUP }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # deliver.py reads the previously delivered platform.app.json (removed settings)

      - name: Delivery flow check (.co-creative.yml)
        # pr-auto and pr-review repositories deliver merged pull requests. A direct push still deploys, with a warning.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flow=$(grep -oE '^delivery:[[:space:]]*[a-z-]+' .co-creative.yml 2>/dev/null | head -1 | sed -E 's/^delivery:[[:space:]]*//')
          case "${flow:-push}" in
            pr-auto|pr-review)
              merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '[.[] | select(.merged_at != null)] | length' 2>/dev/null || echo unknown)
              if [ "$merged" = "0" ]; then
                echo "::warning::.co-creative.yml says 'delivery: $flow', but ${{ github.sha }} is a direct push, not a merged pull request (deployed anyway)"
              elif [ "$merged" = "unknown" ]; then
                echo "::warning::Could not check whether ${{ github.sha }} came from a merged pull request"
              fi ;;
          esac

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: App resources (infra/app.bicep)
        # The app's own resources in rg-<slug> (storage, SQL, Service Bus, SignalR) from the platform's registry
        # module; their settings are applied to the components below. Skipped without infra/app.bicep.
        run: python3 .github/platform/deliver.py resources

      - name: Validate configuration (platform.app.json)
        run: python3 .github/platform/deliver.py validate

      - name: Build images
        # The workflow token is offered to the build as BuildKit secret 'github_token' (never a build arg or layer):
        #   RUN --mount=type=secret,id=github_token NUGET_AUTH_TOKEN="$(cat /run/secrets/github_token)" dotnet restore
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          acr, slug, sha = os.environ['ACR'], os.environ['SLUG'], os.environ['SHA']
          for img in json.load(open('platform.images.json')):
              tag = f"{acr}/{slug}/{img['name']}:{sha}"
              cmd = ['docker', 'build', '-f', img.get('dockerfile', 'Dockerfile'), '-t', tag]
              if img.get('target'):
                  cmd += ['--target', img['target']]
              cmd += ['--secret', 'id=github_token,env=GITHUB_TOKEN']
              cmd.append(img.get('context', '.'))
              subprocess.run(cmd, check=True)
          EOF

      - name: Contract check (web images start without Azure and answer /health)
        # Platform runtime contract (platform.md): the web image listens on 8080 and answers GET /health with 200
        # as soon as the process runs - also without its data or capabilities (first deployment, empty share,
        # database paused). Fails here instead of producing an unhealthy revision in Azure.
        # Opt out per image with "smoke": false in platform.images.json.
        run: |
          python3 - <<'EOF'
          import json, os, subprocess, time, urllib.request
          acr, slug, sha = os.environ['ACR'], os.environ['SLUG'], os.environ['SHA']
          failed = []
          for img in json.load(open('platform.images.json')):
              if img.get('deploy') != 'web' or img.get('smoke', True) is False:
                  continue
              tag = f"{acr}/{slug}/{img['name']}:{sha}"
              name = f"contract-{img['name']}"
              subprocess.run(['docker', 'run', '-d', '--name', name, '-p', '18080:8080',
                              '-e', f'APP_SLUG={slug}', '-e', 'PLATFORM_COMPONENT=web', tag], check=True, capture_output=True)
              ok, last = False, ''
              for _ in range(60):
                  try:
                      with urllib.request.urlopen('http://localhost:18080/health', timeout=2) as r:
                          if r.status == 200:
                              ok = True
                              break
                          last = f'HTTP {r.status}'
                  except Exception as e:
                      last = str(e)[:120]
                  if subprocess.run(['docker', 'inspect', '-f', '{{.State.Running}}', name], capture_output=True, text=True).stdout.strip() != 'true':
                      last = 'container exited'
                      break
                  time.sleep(1)
              logs = subprocess.run(['docker', 'logs', '--tail', '30', name], capture_output=True, text=True)
              subprocess.run(['docker', 'rm', '-f', name], capture_output=True)
              if ok:
                  print(f"{img['name']}: /health 200")
              else:
                  print(logs.stdout + logs.stderr)
                  failed.append(f"{img['name']}: {last}")
          if failed:
              print('::error::Platform contract: the web image must start without Azure resources or data and answer '
                    'GET /health with 200 on port 8080 (see platform.md). Failed: ' + '; '.join(failed))
              raise SystemExit(1)
          EOF

      - name: Push images
        run: |
          az acr login --name "${ACR%%.*}"
          python3 - <<'EOF'
          import json, os, subprocess
          acr, slug, sha = os.environ['ACR'], os.environ['SLUG'], os.environ['SHA']
          for img in json.load(open('platform.images.json')):
              tag = f"{acr}/{slug}/{img['name']}:{sha}"
              subprocess.run(['docker', 'push', tag], check=True)
              print(f'pushed {tag}')
          EOF

      - name: Update the app and jobs (images + platform.app.json)
        # One update per component: image, resources, scale or schedule, env (platform.app.json plus the
        # capability settings from infra/app.bicep). Without platform.app.json, images only.
        run: python3 .github/platform/deliver.py apply

      - name: Record delivery (catalog tags)
        run: |
          az tag update --resource-id "/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/$RG" --operation Merge \
            --tags lastDeliverySha="$SHA" lastDeliveryAt="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o none

      - name: Verify delivery survived concurrent platform deployments
        # A platform infrastructure deployment that started before this delivery may have re-applied the previous
        # image. Re-apply ours if so (the platform also reconciles from the lastDeliverySha tag).
        run: |
          python3 - <<'EOF'
          import json, os, subprocess
          acr, slug, sha, rg = os.environ['ACR'], os.environ['SLUG'], os.environ['SHA'], os.environ['RG']
          def image(kind, name):
              cmd = ['az', 'containerapp'] + (['job'] if kind == 'job' else []) + ['show', '-g', rg, '-n', name,
                     '--query', 'properties.template.containers[0].image', '-o', 'tsv']
              p = subprocess.run(cmd, capture_output=True, text=True)
              return p.stdout.strip() if p.returncode == 0 else None
          for img in json.load(open('platform.images.json')):
              target, tag = img.get('deploy', ''), f"{acr}/{slug}/{img['name']}:{sha}"
              kind, name = ('web', f'{slug}-web') if target == 'web' else ('job', f"{slug}-{target[4:]}") if target.startswith('job:') else (None, None)
              if not kind:
                  continue
              current = image(kind, name)
              if current is None or current == tag:
                  continue
              print(f'::warning::{name} runs {current}; re-applying {tag}')
              update = ['az', 'containerapp'] + (['job'] if kind == 'job' else []) + ['update', '-g', rg, '-n', name, '--image', tag, '-o', 'none']
              subprocess.run(update, check=True)
          EOF

      - name: Smoke test
        run: |
          if ! python3 -c "import json,sys; sys.exit(0 if any(i.get('deploy')=='web' for i in json.load(open('platform.images.json'))) else 1)"; then
            echo "no web component"; exit 0
          fi
          url="https://${{ vars.APP_HOSTNAME }}/health"
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            [ "$code" = "200" ] && { echo "$url: 200"; exit 0; }
            sleep 15
          done
          echo "::error::$url did not return 200 within 10 minutes (last: $code)"; exit 1
